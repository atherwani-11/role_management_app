services:
  - type: web
    name: role-management-backend
    env: node
    branch: main
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        value: your-railway-host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: your-railway-username
      - key: DB_PASSWORD
        value: your-railway-password
      - key: DB_NAME
        value: role_management_app
